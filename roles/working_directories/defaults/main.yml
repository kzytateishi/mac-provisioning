working_directories_links_file: "{{ ansible_facts.env.HOME }}/Dropbox/05_Dev/mac-provisioning/working_directories.yml"

# ~/Documents/<dest> → ~/Dropbox/<src>
working_directories_documents_links: []
# ~/Documents/Contracts/<dest> → ~/Dropbox/<src>
working_directories_contracts_links: []
