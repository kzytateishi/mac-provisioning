- hosts: localhost
  connection: local
  gather_facts: true
  become: false
  environment:
    HOMEBREW_CASK_OPTS: "--appdir=/Applications"
  roles:
    - mac_defaults
    - homebrew
    - dock
    # - mas
    - log_cleaner
    - working_directories
    - zsh
    - vscode
    - cursor
    - ssh
    - git
    - mise
    - npm
    - grok_cli
    - uv
    - macos_security
    - dotfiles
    - claude_code
    - spotlight
